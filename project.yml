name: SelectBar
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  SelectBar:
    type: application
    platform: macOS
    # Only Sources: Tools holds a separate icon-drawing program with its
    # own main.swift, and in a single target the two would clash.
    sources:
      - path: Sources
      - path: AppIcon.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.selectbar
        PRODUCT_NAME: SelectBar
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # The app reads the selection through Accessibility, which does not
        # work inside the sandbox, so the sandbox is deliberately turned off.
        ENABLE_APP_SANDBOX: NO
